# CloudE5 — single-server deployment.
#   docker compose build
#   docker compose run --rm cloude5 migrate                       # first install and every upgrade
#   docker compose run --rm cloude5 admin:create --email=you@example.com --name="Your Name"
#   docker compose up -d
# All persistent data (SQLite database, evidence files, backups) lives in the cloude5-data volume.
services:
  cloude5:
    build: .
    image: cloude5:latest
    restart: unless-stopped
    env_file: .env
    environment:
      CLOUDE5_DATABASE_PATH: /data/db/cloude5.db
      CLOUDE5_EVIDENCE_DIR: /data/evidence
    volumes:
      - cloude5-data:/data
    # Bound to localhost only; publish through the HTTPS reverse proxy below or your own.
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Optional HTTPS reverse proxy with automatic certificates:
  #   CLOUDE5_DOMAIN=cloude5.example.com docker compose --profile proxy up -d
  caddy:
    image: caddy:2
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      - cloude5
    environment:
      CLOUDE5_DOMAIN: ${CLOUDE5_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # Optional public HTTPS URL without opening ports (Cloudflare quick tunnel, no account needed):
  #   docker compose --profile tunnel up -d && docker compose logs cloudflared | grep trycloudflare
  # The URL changes whenever the tunnel restarts; set CLOUDE5_PUBLIC_URL to it and set
  # TRUST_CLOUDFLARE_IP_HEADER=true (only the tunnel can reach the app). For testing only.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      - cloude5
    command: tunnel --no-autoupdate --url http://cloude5:3000

  # Optional local mail catcher for testing without an SMTP provider. Emails never leave this machine;
  # read them at http://localhost:8025. Use with SMTP_HOST=mailpit, SMTP_PORT=1025.
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  cloude5-data:
  caddy-data:
  caddy-config:
